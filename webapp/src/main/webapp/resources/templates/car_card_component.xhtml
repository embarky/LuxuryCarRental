<ui:composition
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:cc="http://xmlns.jcp.org/jsf/composite"
        xmlns:h="http://xmlns.jcp.org/jsf/html">

    <!-- A car in the catalogue. "query" is the query string of the details link. -->
    <cc:interface>
        <cc:attribute name="car" required="true"/>
        <cc:attribute name="query" required="true"/>
    </cc:interface>

    <cc:implementation>
        <a class="car-card" href="#{request.contextPath}/pages/cars_details.xhtml?#{cc.attrs.query}">
            <div class="car-card-image" style="background-image: url('#{cc.attrs.car.imageUrl}');"></div>
            <div class="car-card-body">
                <span class="car-card-category">#{cc.attrs.car.carType.category}</span>
                <h3>#{cc.attrs.car.carType.brand} #{cc.attrs.car.carType.model}</h3>
                <div class="car-card-specs">
                    <span>#{cc.attrs.car.carType.power} hp</span>
                    <span>#{cc.attrs.car.carType.seats} seats</span>
                    <span>#{cc.attrs.car.carType.transmission}</span>
                    <span>#{cc.attrs.car.color}</span>
                </div>
                <div class="car-card-footer">
                    <span class="car-card-price">#{fmt.chf(cc.attrs.car.dailyRentalPrice)} <small>/ day</small></span>
                    <span class="btn btn-outline btn-sm">View</span>
                </div>
            </div>
        </a>
    </cc:implementation>
</ui:composition>
