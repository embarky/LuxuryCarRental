<ui:composition
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <nav class="navbar">
        <div class="nav-container">
            <h:link outcome="/index.xhtml" styleClass="logo">LUXURY CAR RENTAL</h:link>

            <ul class="nav-links">
                <li><h:link value="Cars" outcome="/pages/cars.xhtml"/></li>

                <h:panelGroup rendered="#{adminSessionBean.loggedIn}">
                    <li class="hide-mobile"><h:link value="Admin" outcome="/pages/admin/dashboard.xhtml"/></li>
                </h:panelGroup>

                <h:panelGroup rendered="#{not customerSessionBean.loggedIn}">
                    <li><h:link value="Log in" outcome="/pages/login.xhtml"/></li>
                    <li><h:link value="Sign up" outcome="/pages/register.xhtml" styleClass="nav-cta"/></li>
                </h:panelGroup>

                <h:panelGroup rendered="#{customerSessionBean.loggedIn}">
                    <li><h:link value="My bookings" outcome="/pages/orders.xhtml"/></li>
                    <li class="hide-mobile">
                        <h:link outcome="/pages/account.xhtml" styleClass="nav-balance"
                                title="Your balance – top up in your account">
                            #{fmt.chf(customerSessionBean.customer.balance)}
                        </h:link>
                    </li>
                    <li><h:link value="#{customerSessionBean.customer.firstName}" outcome="/pages/account.xhtml"/></li>
                    <li>
                        <h:form>
                            <h:commandLink value="Log out" action="#{customerSessionBean.logout}" styleClass="nav-link"/>
                        </h:form>
                    </li>
                </h:panelGroup>
            </ul>
        </div>
    </nav>
</ui:composition>
