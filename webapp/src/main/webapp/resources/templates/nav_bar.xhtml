<ui:composition
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:p="http://primefaces.org/ui"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <h:link outcome="/index.xhtml" styleClass="logo">Luxury Car Rental</h:link>

            <ul class="nav-links">
                <li><h:link value="Home" outcome="/index.xhtml"/></li>
                <li><h:link value="Services" outcome="/index.xhtml" fragment="features"/></li>
                <li><h:link value="Cars" outcome="/pages/cars.xhtml"/></li>

                <!-- Administrator logged in: link back to the admin area -->
                <h:panelGroup rendered="#{adminSessionBean.loggedIn}">
                    <li><h:link value="Admin" outcome="/pages/admin/dashboard.xhtml"/></li>
                </h:panelGroup>

                <!-- Not logged in as customer: login link -->
                <h:panelGroup rendered="#{not customerSessionBean.loggedIn}">
                    <li><h:link value="Login" outcome="/pages/login.xhtml"/></li>
                </h:panelGroup>

                <!-- Customer logged in: name with a menu -->
                <h:panelGroup rendered="#{customerSessionBean.loggedIn}">
                    <li>
                        <h:form style="display:inline;">
                            <p:menuButton value="#{customerSessionBean.customer.firstName}"
                                          icon="pi pi-user"
                                          styleClass="nav-user-menu">
                                <p:menuitem value="My bookings"
                                            icon="pi pi-shopping-cart"
                                            outcome="/pages/orders.xhtml"/>
                                <p:menuitem value="Logout"
                                            icon="pi pi-sign-out"
                                            action="#{customerSessionBean.logout}"
                                            ajax="false"/>
                            </p:menuButton>
                        </h:form>
                    </li>
                </h:panelGroup>
            </ul>
        </div>
    </nav>
</ui:composition>
