<!DOCTYPE html>
<!--
    Layout shared by all admin pages: sidebar, top bar, messages and content.
    Pages define "title" and "content" (and optionally "metadata") and set
    <ui:param name="activePage" value="..."/> to highlight their menu item.
-->
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      lang="en">

<ui:insert name="metadata"/>

<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title><ui:insert name="title">Admin</ui:insert> · Luxury Car Rental Admin</title>
    <h:outputStylesheet name="css/site.css"/>
    <h:outputStylesheet name="css/app.css"/>
    <h:outputStylesheet name="css/admin.css"/>
</h:head>

<h:body styleClass="admin-body">
    <div class="admin-shell">
        <nav class="admin-sidebar">
            <h:link outcome="/pages/admin/dashboard.xhtml" styleClass="admin-brand">LUXURY CAR RENTAL</h:link>
            <span class="admin-brand-sub">Administration</span>

            <h:link outcome="/pages/admin/dashboard.xhtml"
                    styleClass="admin-nav-item #{activePage eq 'dashboard' ? 'active' : ''}">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
                Dashboard
            </h:link>

            <div class="admin-section">Rentals</div>
            <h:link outcome="/pages/admin/bookings.xhtml"
                    styleClass="admin-nav-item #{activePage eq 'bookings' ? 'active' : ''}">
                <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                Bookings
            </h:link>
            <h:link outcome="/pages/admin/customers.xhtml"
                    styleClass="admin-nav-item #{activePage eq 'customers' ? 'active' : ''}">
                <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                Customers
            </h:link>

            <div class="admin-section">Fleet</div>
            <h:link outcome="/pages/admin/car.xhtml"
                    styleClass="admin-nav-item #{activePage eq 'car' ? 'active' : ''}">
                <svg viewBox="0 0 24 24"><path d="M3 13l1.5-4.5h15L21 13v6H3v-6z"/><circle cx="7.5" cy="19.5" r="1.5"/><circle cx="16.5" cy="19.5" r="1.5"/></svg>
                Cars
            </h:link>
            <h:link outcome="/pages/admin/car_type.xhtml"
                    styleClass="admin-nav-item #{activePage eq 'car_type' ? 'active' : ''}">
                <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
                Car types
            </h:link>

            <div class="admin-section">Team</div>
            <h:link outcome="/pages/admin/admins.xhtml"
                    styleClass="admin-nav-item #{activePage eq 'admins' ? 'active' : ''}">
                <svg viewBox="0 0 24 24"><path d="M12 2l8 4v6c0 5-3.5 9-8 10-4.5-1-8-5-8-10V6z"/></svg>
                Administrators
            </h:link>
            <h:link outcome="/index.xhtml" styleClass="admin-nav-item">
                <svg viewBox="0 0 24 24"><path d="M15 3h6v6M10 14L21 3M21 14v7H3V3h7"/></svg>
                View website
            </h:link>
        </nav>

        <div class="admin-main">
            <header class="admin-topbar">
                <div class="admin-user">
                    <span class="avatar">#{adminSessionBean.initial}</span>
                    <span>#{adminSessionBean.admin.name}</span>
                </div>
                <h:form>
                    <h:commandButton value="Log out" action="#{adminSessionBean.logout}" styleClass="btn btn-outline btn-sm"/>
                </h:form>
            </header>

            <h:panelGroup id="toasts" layout="block">
                <h:messages globalOnly="true" styleClass="toasts"
                            infoClass="toast-info" warnClass="toast-warn" errorClass="toast-error"/>
            </h:panelGroup>

            <div class="admin-content">
                <ui:insert name="content"/>
            </div>
        </div>
    </div>

    <h:outputScript name="js/script.js"/>
</h:body>
</html>
