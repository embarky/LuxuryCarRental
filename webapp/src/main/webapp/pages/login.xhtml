<ui:composition template="/resources/templates/master_template.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:pt="http://xmlns.jcp.org/jsf/passthrough">

    <ui:define name="title">Log in</ui:define>

    <ui:define name="content">
        <div class="page page-narrow">
            <h:form styleClass="card auth-card">
                <h1>Welcome back</h1>
                <p class="muted" style="margin-bottom: 22px;">Log in to book a car and manage your bookings.</p>

                <div class="stack">
                    <div class="field">
                        <label for="email">Email</label>
                        <h:inputText id="email" value="#{customerSessionBean.email}" required="true"
                                     requiredMessage="Please enter your email."
                                     pt:type="email" pt:autocomplete="email" pt:autofocus="autofocus"/>
                    </div>
                    <div class="field">
                        <div class="spread">
                            <label for="password">Password</label>
                            <h:link value="Forgot password?" outcome="/pages/reset-password.xhtml" styleClass="small"/>
                        </div>
                        <h:inputSecret id="password" value="#{customerSessionBean.password}" required="true"
                                       requiredMessage="Please enter your password." pt:autocomplete="current-password"/>
                    </div>
                </div>

                <h:messages globalOnly="false" showSummary="true" styleClass="notice notice-error"
                            style="list-style: none; margin-top: 16px;" rendered="#{facesContext.validationFailed}"/>

                <div class="form-actions">
                    <h:commandButton value="Log in" action="#{customerSessionBean.login}" styleClass="btn btn-primary btn-block"/>
                </div>

                <p class="auth-footer">New here? <h:link value="Create an account" outcome="/pages/register.xhtml"/></p>
                <p class="auth-footer small">Staff? <h:link value="Administrator login" outcome="/pages/staff-login.xhtml"/></p>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
