<ui:composition template="/resources/templates/master_template.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:pt="http://xmlns.jcp.org/jsf/passthrough">

    <ui:define name="title">Create an account</ui:define>

    <ui:define name="content">
        <div class="page page-medium">
            <h:form styleClass="card">
                <h1 class="auth-card" style="max-width: none; font-family: var(--font-display); font-weight: 400; font-size: 30px;">Create your account</h1>
                <p class="muted" style="margin-bottom: 24px;">Your driving licence is checked once by our team before your first payment.</p>

                <h2 class="small muted" style="text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px;">About you</h2>
                <div class="form-grid">
                    <div class="field">
                        <label for="firstName">First name</label>
                        <h:inputText id="firstName" value="#{registerBean.form.firstName}" pt:autocomplete="given-name" pt:required="required"/>
                    </div>
                    <div class="field">
                        <label for="lastName">Last name</label>
                        <h:inputText id="lastName" value="#{registerBean.form.lastName}" pt:autocomplete="family-name" pt:required="required"/>
                    </div>
                    <div class="field">
                        <label for="email">Email</label>
                        <h:inputText id="email" value="#{registerBean.form.email}" pt:type="email" pt:autocomplete="email" pt:required="required"/>
                    </div>
                    <div class="field">
                        <label for="phone">Phone</label>
                        <h:inputText id="phone" value="#{registerBean.form.phoneNumber}" pt:type="tel"
                                     pt:placeholder="+41 79 123 45 67" pt:autocomplete="tel" pt:required="required"/>
                    </div>
                    <div class="field">
                        <label for="dob">Date of birth</label>
                        <h:inputText id="dob" value="#{registerBean.form.dateOfBirth}" pt:type="date" pt:required="required">
                            <f:convertDateTime type="localDate" pattern="yyyy-MM-dd"/>
                        </h:inputText>
                        <span class="hint">You must be at least 18 years old.</span>
                    </div>
                    <div class="field">
                        <label for="address">Billing address <span class="muted">(optional)</span></label>
                        <h:inputText id="address" value="#{registerBean.form.billingAddress}" pt:autocomplete="street-address"/>
                    </div>
                </div>

                <h2 class="small muted" style="text-transform: uppercase; letter-spacing: 1px; margin: 26px 0 12px;">Driving licence</h2>
                <div class="form-grid">
                    <div class="field">
                        <label for="licence">Licence number</label>
                        <h:inputText id="licence" value="#{registerBean.form.drivingLicenseNumber}" pt:required="required"/>
                    </div>
                    <div class="field">
                        <label for="expiry">Valid until</label>
                        <h:inputText id="expiry" value="#{registerBean.form.drivingLicenseExpiryDate}" pt:type="date"
                                     pt:min="#{fmt.tomorrow()}" pt:required="required">
                            <f:convertDateTime type="localDate" pattern="yyyy-MM-dd"/>
                        </h:inputText>
                    </div>
                </div>

                <h2 class="small muted" style="text-transform: uppercase; letter-spacing: 1px; margin: 26px 0 12px;">Password</h2>
                <div class="form-grid">
                    <div class="field">
                        <label for="password">Password</label>
                        <h:inputSecret id="password" value="#{registerBean.form.password}" pt:autocomplete="new-password"
                                       pt:required="required" pt:minlength="8"/>
                        <span class="hint">At least 8 characters, with letters and digits.</span>
                    </div>
                    <div class="field">
                        <label for="confirm">Repeat the password</label>
                        <h:inputSecret id="confirm" value="#{registerBean.confirmPassword}" pt:autocomplete="new-password"
                                       pt:required="required"/>
                    </div>
                </div>

                <div class="form-actions">
                    <h:commandButton value="Create my account" action="#{registerBean.register}" styleClass="btn btn-primary"/>
                </div>
                <p class="muted small" style="margin-top: 14px;">
                    Already have an account? <h:link value="Log in" outcome="/pages/login.xhtml"/>
                </p>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
