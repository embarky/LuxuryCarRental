<ui:composition template="/resources/templates/master_template.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:pt="http://xmlns.jcp.org/jsf/passthrough">

    <ui:define name="metadata">
        <f:metadata>
            <f:viewParam name="role" value="#{resetBean.role}"/>
        </f:metadata>
    </ui:define>

    <ui:define name="title">Reset your password</ui:define>

    <ui:define name="content">
        <div class="page page-narrow">
            <h:form styleClass="card auth-card">
                <h:outputText styleClass="badge badge-gold" value="Administrator account" rendered="#{resetBean.admin}"/>
                <h1 style="margin-top: 6px;">Reset your password</h1>

                <!-- Step 1: email -->
                <h:panelGroup rendered="#{not resetBean.codeSent}">
                    <p class="muted" style="margin-bottom: 22px;">Enter the email of your account. We will send you a 6-digit code.</p>
                    <div class="field">
                        <label for="email">Email</label>
                        <h:inputText id="email" value="#{resetBean.email}" pt:type="email" pt:required="required"
                                     pt:autofocus="autofocus"/>
                    </div>
                    <div class="form-actions">
                        <h:commandButton value="Send me a code" action="#{resetBean.sendCode}" styleClass="btn btn-primary btn-block"/>
                    </div>
                </h:panelGroup>

                <!-- Step 2: code and new password -->
                <h:panelGroup rendered="#{resetBean.codeSent}">
                    <p class="muted" style="margin-bottom: 22px;">
                        Enter the code sent to <b>#{resetBean.email}</b>. It is valid for 10 minutes.
                    </p>
                    <div class="stack">
                        <div class="field">
                            <label for="code">Code</label>
                            <h:inputText id="code" value="#{resetBean.code}" pt:inputmode="numeric" pt:maxlength="6"
                                         pt:autocomplete="one-time-code" pt:required="required" pt:autofocus="autofocus"/>
                        </div>
                        <div class="field">
                            <label for="newPassword">New password</label>
                            <h:inputSecret id="newPassword" value="#{resetBean.newPassword}" pt:required="required"
                                           pt:autocomplete="new-password"/>
                            <span class="hint">At least 8 characters, with letters and digits.</span>
                        </div>
                        <div class="field">
                            <label for="confirm">Repeat the new password</label>
                            <h:inputSecret id="confirm" value="#{resetBean.confirmPassword}" pt:required="required"
                                           pt:autocomplete="new-password"/>
                        </div>
                    </div>
                    <div class="form-actions">
                        <h:commandButton value="Set new password" action="#{resetBean.reset}" styleClass="btn btn-primary btn-block"/>
                    </div>
                    <p class="auth-footer">
                        <h:commandLink value="Use another email" action="#{resetBean.changeEmail}" immediate="true"/>
                        · <h:commandLink value="Send a new code" action="#{resetBean.sendCode}"/>
                    </p>
                </h:panelGroup>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
