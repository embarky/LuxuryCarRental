<ui:composition template="/WEB-INF/templates/admin.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:pt="http://xmlns.jcp.org/jsf/passthrough">

    <ui:param name="activePage" value="car_type"/>

    <ui:define name="metadata">
        <f:metadata>
            <f:viewParam name="id" value="#{carTypeFormBean.id}"/>
            <f:viewAction action="#{carTypeFormBean.load}"/>
        </f:metadata>
    </ui:define>

    <ui:define name="title">#{carTypeFormBean.editing ? 'Edit car type' : 'Add a car type'}</ui:define>

    <ui:define name="content">
        <div class="page-header">
            <div>
                <h:link value="← Car types" outcome="/pages/admin/car_type.xhtml" styleClass="small"/>
                <h1>#{carTypeFormBean.editing ? 'Edit car type' : 'Add a car type'}</h1>
            </div>
        </div>

        <h:form styleClass="card" rendered="#{carTypeFormBean.carType ne null}" style="max-width: 860px;">
            <div class="form-grid">
                <div class="field">
                    <label for="brand">Brand</label>
                    <h:inputText id="brand" value="#{carTypeFormBean.carType.brand}"/>
                </div>
                <div class="field">
                    <label for="model">Model</label>
                    <h:inputText id="model" value="#{carTypeFormBean.carType.model}"/>
                </div>
                <div class="field">
                    <label for="category">Category</label>
                    <h:inputText id="category" value="#{carTypeFormBean.carType.category}" pt:placeholder="Sport, SUV, Electric..."/>
                </div>
                <div class="field">
                    <label for="engine">Engine</label>
                    <h:inputText id="engine" value="#{carTypeFormBean.carType.engine}" pt:placeholder="3.0L twin-turbo"/>
                </div>
                <div class="field">
                    <label for="power">Power (hp)</label>
                    <h:inputText id="power" value="#{carTypeFormBean.carType.power}" pt:type="number" pt:min="0"/>
                </div>
                <div class="field">
                    <label for="speed">Top speed (km/h)</label>
                    <h:inputText id="speed" value="#{carTypeFormBean.carType.maxSpeed}" pt:type="number" pt:min="0"/>
                </div>
                <div class="field">
                    <label for="acceleration">0–100 km/h (s)</label>
                    <h:inputText id="acceleration" value="#{carTypeFormBean.carType.acceleration}" pt:type="number" pt:min="0" pt:step="0.1"/>
                </div>
                <div class="field">
                    <label for="weight">Weight (kg)</label>
                    <h:inputText id="weight" value="#{carTypeFormBean.carType.weight}" pt:type="number" pt:min="0"/>
                </div>
                <div class="field">
                    <label for="seats">Seats</label>
                    <h:inputText id="seats" value="#{carTypeFormBean.carType.seats}" pt:type="number" pt:min="1" pt:max="9"/>
                </div>
                <div class="field">
                    <label for="drive">Drive</label>
                    <h:selectOneMenu id="drive" value="#{carTypeFormBean.carType.driveType}">
                        <f:selectItems value="#{carTypeFormBean.driveTypes}"/>
                    </h:selectOneMenu>
                </div>
                <div class="field">
                    <label for="gearbox">Gearbox</label>
                    <h:selectOneMenu id="gearbox" value="#{carTypeFormBean.carType.transmission}">
                        <f:selectItems value="#{carTypeFormBean.transmissions}"/>
                    </h:selectOneMenu>
                </div>
                <div class="field full">
                    <label for="features">Features</label>
                    <h:inputText id="features" value="#{carTypeFormBean.features}" pt:placeholder="GPS, Heated seats, Panoramic roof"/>
                    <span class="hint">Separate them with commas.</span>
                </div>
                <div class="field full">
                    <label for="description">Description</label>
                    <h:inputTextarea id="description" value="#{carTypeFormBean.carType.description}"/>
                </div>
            </div>
            <div class="form-actions">
                <h:commandButton value="Save" action="#{carTypeFormBean.save}" styleClass="btn btn-primary"/>
                <h:link value="Cancel" outcome="/pages/admin/car_type.xhtml" styleClass="btn btn-outline"/>
            </div>
        </h:form>
    </ui:define>
</ui:composition>
