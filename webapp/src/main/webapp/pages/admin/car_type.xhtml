<ui:composition template="/WEB-INF/templates/admin.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:param name="activePage" value="car_type"/>
    <ui:define name="title">Car types</ui:define>

    <ui:define name="content">
        <div class="page-header">
            <div>
                <h1>Car types</h1>
                <p>Models and their specifications. A type can only be deleted when no car uses it.</p>
            </div>
            <h:link value="Add a car type" outcome="/pages/admin/car_type_form.xhtml" styleClass="btn btn-primary"/>
        </div>

        <h:form>
            <div class="card card-flush">
                <h:panelGroup layout="block" styleClass="empty" rendered="#{empty carAdminBean.carTypes}">
                    <h3>No car types yet</h3>
                </h:panelGroup>
                <h:panelGroup layout="block" styleClass="table-wrap" rendered="#{not empty carAdminBean.carTypes}">
                    <table class="table">
                        <thead><tr><th>Model</th><th>Category</th><th>Engine</th><th class="right">Power</th><th class="right">Seats</th><th>Gearbox</th><th class="right">Cars</th><th></th></tr></thead>
                        <tbody>
                        <ui:repeat value="#{carAdminBean.carTypes}" var="t">
                            <tr>
                                <td class="cell-title">#{t.brand} #{t.model}</td>
                                <td><span class="badge badge-gold">#{t.category}</span></td>
                                <td>#{t.engine}</td>
                                <td class="right">#{t.power} hp</td>
                                <td class="right">#{t.seats}</td>
                                <td>#{fmt.gearbox(t.transmission)}</td>
                                <td class="right">#{carAdminBean.carsOfType(t)}</td>
                                <td class="actions">
                                    <h:link value="Edit" outcome="/pages/admin/car_type_form.xhtml" styleClass="btn btn-outline btn-sm">
                                        <f:param name="id" value="#{t.id}"/>
                                    </h:link>
                                    <h:commandButton value="Delete" action="#{carAdminBean.deleteCarType(t.id)}" styleClass="btn btn-danger btn-sm"
                                                     onclick="return confirm('Delete #{t.brand} #{t.model}?');"/>
                                </td>
                            </tr>
                        </ui:repeat>
                        </tbody>
                    </table>
                </h:panelGroup>
            </div>
        </h:form>
    </ui:define>
</ui:composition>
