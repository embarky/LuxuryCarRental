<ui:composition template="/WEB-INF/templates/admin.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:pt="http://xmlns.jcp.org/jsf/passthrough">

    <ui:param name="activePage" value="car"/>

    <ui:define name="metadata">
        <f:metadata>
            <f:viewParam name="id" value="#{carFormBean.id}"/>
            <f:viewAction action="#{carFormBean.load}"/>
        </f:metadata>
    </ui:define>

    <ui:define name="title">#{carFormBean.editing ? 'Edit car' : 'Add a car'}</ui:define>

    <ui:define name="content">
        <div class="page-header">
            <div>
                <h:link value="← Cars" outcome="/pages/admin/car.xhtml" styleClass="small"/>
                <h1>#{carFormBean.editing ? 'Edit car' : 'Add a car'}</h1>
            </div>
        </div>

        <h:form styleClass="card" rendered="#{carFormBean.car ne null}" style="max-width: 860px;">
            <div class="form-grid">
                <div class="field">
                    <label for="type">Car type</label>
                    <h:selectOneMenu id="type" value="#{carFormBean.carTypeId}">
                        <f:selectItem itemLabel="Choose a car type" itemValue="#{null}" noSelectionOption="true"/>
                        <f:selectItems value="#{carFormBean.carTypes}" var="t" itemValue="#{t.id}"
                                       itemLabel="#{t.brand} #{t.model} (#{t.category})"/>
                    </h:selectOneMenu>
                    <span class="hint"><h:link value="Add a car type" outcome="/pages/admin/car_type_form.xhtml"/> if it is missing.</span>
                </div>
                <div class="field">
                    <label for="plate">Licence plate</label>
                    <h:inputText id="plate" value="#{carFormBean.car.licensePlate}" pt:placeholder="VD 123 456"/>
                </div>
                <div class="field">
                    <label for="price">Price per day (CHF)</label>
                    <h:inputText id="price" value="#{carFormBean.car.dailyRentalPrice}" pt:type="number" pt:min="1" pt:step="0.01"/>
                </div>
                <div class="field">
                    <label for="deposit">Deposit (CHF)</label>
                    <h:inputText id="deposit" value="#{carFormBean.car.depositAmount}" pt:type="number" pt:min="1" pt:step="0.01"/>
                </div>
                <div class="field">
                    <label for="color">Colour</label>
                    <h:inputText id="color" value="#{carFormBean.car.color}"/>
                </div>
                <div class="field">
                    <label for="status">Status</label>
                    <h:selectOneMenu id="status" value="#{carFormBean.car.status}">
                        <f:selectItems value="#{carFormBean.statuses}" var="s" itemValue="#{s}" itemLabel="#{fmt.carStatus(s)}"/>
                    </h:selectOneMenu>
                </div>
                <div class="field">
                    <label for="vin">VIN</label>
                    <h:inputText id="vin" value="#{carFormBean.car.vin}"/>
                </div>
                <div class="field">
                    <label for="registration">First registration</label>
                    <h:inputText id="registration" value="#{carFormBean.car.registrationDate}" pt:type="date">
                        <f:convertDateTime type="localDate" pattern="yyyy-MM-dd"/>
                    </h:inputText>
                </div>
                <div class="field">
                    <label for="maintenance">Last maintenance</label>
                    <h:inputText id="maintenance" value="#{carFormBean.car.lastMaintenanceDate}" pt:type="date">
                        <f:convertDateTime type="localDate" pattern="yyyy-MM-dd"/>
                    </h:inputText>
                </div>
                <div class="field">
                    <label for="insurance">Insurance valid until</label>
                    <h:inputText id="insurance" value="#{carFormBean.car.insuranceExpiryDate}" pt:type="date">
                        <f:convertDateTime type="localDate" pattern="yyyy-MM-dd"/>
                    </h:inputText>
                </div>
                <div class="field full">
                    <label for="image">Image URL</label>
                    <h:inputText id="image" value="#{carFormBean.car.imageUrl}" pt:type="url" pt:placeholder="https://..."/>
                </div>
            </div>
            <div class="form-actions">
                <h:commandButton value="Save" action="#{carFormBean.save}" styleClass="btn btn-primary"/>
                <h:link value="Cancel" outcome="/pages/admin/car.xhtml" styleClass="btn btn-outline"/>
            </div>
        </h:form>
    </ui:define>
</ui:composition>
