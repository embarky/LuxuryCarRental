<ui:composition template="/resources/templates/master_template.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
                xmlns:ed="http://xmlns.jcp.org/jsf/composite/templates">

    <ui:define name="metadata">
        <f:metadata>
            <f:viewParam name="start" value="#{carsBean.start}">
                <f:convertDateTime type="localDate" pattern="yyyy-MM-dd"/>
            </f:viewParam>
            <f:viewParam name="end" value="#{carsBean.end}">
                <f:convertDateTime type="localDate" pattern="yyyy-MM-dd"/>
            </f:viewParam>
            <f:viewAction action="#{carsBean.searchIfDates}"/>
        </f:metadata>
    </ui:define>

    <ui:define name="title">Our cars</ui:define>

    <ui:define name="content">
        <div class="page">
            <div class="page-header">
                <div>
                    <h1>Our cars</h1>
                    <p>
                        <h:outputText rendered="#{carsBean.datesChosen}"
                                      value="#{carsBean.carCount} cars free from #{fmt.date(carsBean.start)} to #{fmt.date(carsBean.end)}"/>
                        <h:outputText rendered="#{not carsBean.datesChosen}"
                                      value="#{carsBean.carCount} cars. Choose your dates to see which ones are free."/>
                    </p>
                </div>
            </div>

            <h:form styleClass="filters">
                <div class="field">
                    <label for="text">Search</label>
                    <h:inputText id="text" value="#{carsBean.text}" pt:placeholder="Brand, model or colour"/>
                </div>
                <div class="field">
                    <label for="category">Category</label>
                    <h:selectOneMenu id="category" value="#{carsBean.category}">
                        <f:selectItem itemLabel="All categories" itemValue="#{null}" noSelectionOption="true"/>
                        <f:selectItems value="#{carsBean.categories}"/>
                    </h:selectOneMenu>
                </div>
                <div class="field">
                    <label for="maxPrice">Max. per day (CHF)</label>
                    <h:inputText id="maxPrice" value="#{carsBean.maxPrice}" pt:type="number" pt:min="0" pt:step="50"/>
                </div>
                <div class="field">
                    <label for="start">Pick-up</label>
                    <h:inputText id="start" value="#{carsBean.start}" pt:type="date" pt:min="#{fmt.today()}">
                        <f:convertDateTime type="localDate" pattern="yyyy-MM-dd"/>
                    </h:inputText>
                </div>
                <div class="field">
                    <label for="end">Return</label>
                    <h:inputText id="end" value="#{carsBean.end}" pt:type="date" pt:min="#{fmt.tomorrow()}">
                        <f:convertDateTime type="localDate" pattern="yyyy-MM-dd"/>
                    </h:inputText>
                </div>
                <div class="row">
                    <h:commandButton value="Search" action="#{carsBean.search}" styleClass="btn btn-primary"/>
                    <h:commandButton value="Reset" action="#{carsBean.reset}" styleClass="btn btn-outline"/>
                </div>
            </h:form>

            <h:panelGroup layout="block" styleClass="cars-grid" rendered="#{carsBean.carCount gt 0}">
                <ui:repeat value="#{carsBean.cars}" var="car">
                    <ed:car_card_component car="#{car}" query="#{carsBean.detailsQuery(car)}"/>
                </ui:repeat>
            </h:panelGroup>

            <h:panelGroup layout="block" styleClass="card empty" rendered="#{carsBean.carCount eq 0}">
                <h3>No car matches your search</h3>
                <p>Try other dates or remove some filters.</p>
            </h:panelGroup>
        </div>
    </ui:define>
</ui:composition>
