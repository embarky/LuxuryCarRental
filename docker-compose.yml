services:
  # Data layer: MySQL
  db:
    image: mysql:8.0.43
    container_name: luxurycarrental-db
    env_file: .env
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Service layer (REST API) + presentation layer (JSF) on Payara
  app:
    build: .
    container_name: luxurycarrental-app
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "8080:8080"   # web UI and REST API
      - "4848:4848"   # Payara admin console

  # Local mail server: catches every email the application sends.
  # Open http://localhost:8025 to read them. Nothing is delivered to real inboxes.
  mailpit:
    image: axllent/mailpit:latest
    container_name: luxurycarrental-mailpit
    environment:
      MP_MAX_MESSAGES: 2000
    ports:
      - "8025:8025"   # web UI

  # Demo data: fills an empty database through the REST API, then exits
  seeder:
    image: python:3.12-slim
    container_name: luxurycarrental-seeder
    env_file: .env
    environment:
      API_BASE_URL: http://app:8080/luxurycarrental/api
    depends_on:
      - app
    volumes:
      - ./scripts/seeder:/seeder:ro
    command:
      - sh
      - -c
      - pip install -q --root-user-action=ignore --disable-pip-version-check -r /seeder/requirements.txt && python -u /seeder/database_seeder.py
    restart: "no"

volumes:
  db_data:
